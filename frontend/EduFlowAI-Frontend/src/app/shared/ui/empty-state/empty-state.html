<section class="state" aria-live="polite">
  <span class="state__icon material-symbols-outlined" aria-hidden="true">
    {{ icon() }}
  </span>
  <h2>{{ title() }}</h2>
  @if (description()) {
    <p>{{ description() }}</p>
  }
  @if (actionLabel()) {
    <button type="button" (click)="action.emit()">{{ actionLabel() }}</button>
  }
</section>
